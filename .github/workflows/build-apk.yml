name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Copy app icons
        run: |
          set -e
          RES=android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p $RES/$d
          done
          if [ -f icon-512.png ]; then
            cp icon-512.png $RES/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png $RES/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-hdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-mdpi/ic_launcher.png
            rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml || true
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-capacitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
