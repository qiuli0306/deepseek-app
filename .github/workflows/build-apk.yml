name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ANDROID_USER_HOME: ${{ github.workspace }}/.android-home
  XDG_CONFIG_HOME: ${{ github.workspace }}/.config-home

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare dirs
        run: |
          mkdir -p "$ANDROID_USER_HOME" "$XDG_CONFIG_HOME"
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>deepseek</title></head><body></body></html>' > www/index.html
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Ensure assets dir
        run: mkdir -p android/app/src/main/assets

      - name: Sync web assets
        run: npx cap sync android

      - name: Accept Android licenses
        run: yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy app icons
        run: |
          set -e
          RES=android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p $RES/$d
          done
          if [ -f icon-512.png ]; then
            cp icon-512.png $RES/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png $RES/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-hdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-mdpi/ic_launcher.png
            rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml || true
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-capacitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
