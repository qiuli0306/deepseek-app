name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare webDir
        run: |
          mkdir -p www
          [ -f www/index.html ] || printf '<!DOCTYPE html><html><body></body></html>' > www/index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Ensure assets dir
        run: mkdir -p android/app/src/main/assets

      - name: Sync web assets
        run: npx cap sync android

      - name: Create keystore and inject signing
        run: |
          set -e
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          block = '''    signingConfigs {
              debug {
                  storeFile file("debug.keystore")
                  storePassword "android"
                  keyAlias "androiddebugkey"
                  keyPassword "android"
              }
          }
          '''
          if 'signingConfigs' not in s:
              s = s.replace('android {', 'android {\n' + block, 1)
              open(p, 'w').write(s)
              print('INJECTED OK')
          else:
              print('ALREADY HAS signingConfigs')
          PY
          grep -n "signingConfigs" android/app/build.gradle | head -5
          ls -l android/app/debug.keystore

      - name: Accept Android licenses
        run: yes | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy app icons
        run: |
          set -e
          RES=android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do mkdir -p $RES/$d; done
          if [ -f icon-512.png ]; then
            cp icon-512.png $RES/mipmap-xxxhdpi/ic_launcher.png
            cp icon-512.png $RES/mipmap-xxhdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-xhdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-hdpi/ic_launcher.png
            cp icon-192.png $RES/mipmap-mdpi/ic_launcher.png
            rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml || true
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-capacitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
